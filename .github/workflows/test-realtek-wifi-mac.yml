name: Test Realtek WiFi MAC helpers
on:
  push:
    paths:
      - "cores/realtek-amb/arduino/libraries/WiFi/WiFiMacText.h"
      - "tests/realtek_wifi_mac/**"
      - ".github/workflows/test-realtek-wifi-mac.yml"
  pull_request:
    paths:
      - "cores/realtek-amb/arduino/libraries/WiFi/WiFiMacText.h"
      - "tests/realtek_wifi_mac/**"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I cores/realtek-amb/arduino/libraries/WiFi \
            tests/realtek_wifi_mac/test_mac_text.cpp -o /tmp/test_mac_text
          /tmp/test_mac_text
